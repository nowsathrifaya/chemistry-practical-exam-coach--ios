workflows:
  ios-release:
    name: Chemistry Practical Exam Coach - iOS Release
    max_build_duration: 60

    integrations:
      app_store_connect: Physics Practical Exam Coach

    environment:
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nowsathrifaya.chemistrycoach

      vars:
        BUNDLE_ID: "com.nowsathrifaya.chemistrycoach"
        XCODE_PROJECT: "ChemistryCoach.xcodeproj"
        XCODE_SCHEME: "ChemistryCoach"
        APP_VERSION: "1.1.0"

    scripts:

      # ==========================================
      # 1. GENERATE XCODE PROJECT
      # ==========================================
      - name: Install XcodeGen and generate project
        script: |
          set -e

          echo "=========================================="
          echo "GENERATING XCODE PROJECT"
          echo "=========================================="

          brew install xcodegen || true

          echo "Current directory:"
          pwd

          echo "Repository contents:"
          ls -la

          if [ ! -f "project.yml" ]; then
            echo "ERROR: project.yml not found"
            exit 1
          fi

          xcodegen generate

          if [ ! -d "ChemistryCoach.xcodeproj" ]; then
            echo "ERROR: ChemistryCoach.xcodeproj was not generated"
            exit 1
          fi

          echo "Xcode project generated successfully."

      # ==========================================
      # 2. SET VERSION / BUILD
      # ==========================================
      - name: Set application version and build number
        script: |
          set -e

          echo "=========================================="
          echo "SETTING VERSION"
          echo "=========================================="

          xcrun agvtool new-marketing-version "$APP_VERSION"

          # Codemagic's own $BUILD_NUMBER counter can be lower than the highest
          # build already sitting in App Store Connect (e.g. after a workflow
          # rename, a manual upload, or the counter being reset) — and ASC
          # rejects any upload whose CFBundleVersion isn't strictly higher than
          # the last one it has on file. So rather than trust $BUILD_NUMBER
          # blindly, ask App Store Connect for the latest build number it has
          # for this app and build one past that; this self-heals even if the
          # local counter resets again later. `get-latest-build-number` needs
          # the app's numeric Apple ID (APP_STORE_APP_ID), not the bundle
          # identifier — falls back to $BUILD_NUMBER (then 2) if that isn't
          # set, or if the lookup fails, e.g. before any build exists yet.
          LATEST_ASC_BUILD_NUMBER=""
          if [ -n "${APP_STORE_APP_ID:-}" ]; then
            LATEST_ASC_BUILD_NUMBER="$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")"
          fi

          if [ -n "$LATEST_ASC_BUILD_NUMBER" ] && [ "$LATEST_ASC_BUILD_NUMBER" -ge 0 ] 2>/dev/null; then
            BUILD_NUMBER_VALUE=$((LATEST_ASC_BUILD_NUMBER + 1))
            echo "Latest build number on App Store Connect: $LATEST_ASC_BUILD_NUMBER"
          else
            echo "Could not fetch latest build number from App Store Connect (APP_STORE_APP_ID unset or lookup failed) — falling back to \$BUILD_NUMBER."
            BUILD_NUMBER_VALUE="${BUILD_NUMBER:-2}"
          fi

          # Safety-net floor: App Store Connect already has build 21 on file
          # (as of this fix), so even without APP_STORE_APP_ID set yet, the
          # fallback won't collide with it. Once APP_STORE_APP_ID is filled
          # in above, this floor stops mattering since the ASC lookup will
          # already be ahead of it.
          if [ "$BUILD_NUMBER_VALUE" -lt 22 ]; then
            BUILD_NUMBER_VALUE=22
          fi

          echo "Marketing Version: $APP_VERSION"
          echo "Build Number: $BUILD_NUMBER_VALUE"

          xcrun agvtool new-version -all "$BUILD_NUMBER_VALUE"

          echo "Checking final settings..."

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings | \
            grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION"

      # ==========================================
      # 3. USE CODEMAGIC AUTOMATIC SIGNING
      # ==========================================
      - name: Configure code signing
        script: |
          set -e

          echo "=========================================="
          echo "CODE SIGNING"
          echo "=========================================="

          echo "Bundle ID: $BUNDLE_ID"

          if [ -z "$BUNDLE_ID" ]; then
            echo "ERROR: BUNDLE_ID is empty"
            exit 1
          fi

          echo "Using Codemagic iOS signing configuration."
          echo "Distribution type: App Store"
          echo "Bundle ID: $BUNDLE_ID"

          # Apply the provisioning profiles downloaded
          # by Codemagic's ios_signing environment.
          xcode-project use-profiles

          echo "Code signing configuration applied successfully."

      # ==========================================
      # 4. VERIFY
      # ==========================================
      - name: Verify project
        script: |
          set -e

          echo "=========================================="
          echo "VERIFYING PROJECT"
          echo "=========================================="

          test -d "$XCODE_PROJECT"

          echo "Project:"
          echo "$XCODE_PROJECT"

          echo "Scheme:"
          echo "$XCODE_SCHEME"

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings | \
            grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|CODE_SIGN"

      # ==========================================
      # 5. BUILD IPA
      # ==========================================
      - name: Build IPA
        script: |
          set -e

          echo "=========================================="
          echo "BUILDING IPA"
          echo "=========================================="

          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

          echo "=========================================="
          echo "IPA BUILD COMPLETE"
          echo "=========================================="

          ls -lah build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
