name: ChemistryCoach

options:
  bundleIdPrefix: com.nowsathrifaya

  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"

targets:
  ChemistryCoach:
    type: application
    platform: iOS

    deploymentTarget: "17.0"

    sources:
      - path: ChemistryCoach
        excludes:
          - Resources/Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nowsathrifaya.chemistrycoach
        PRODUCT_NAME: "Chemistry Practical Exam Coach"

        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "4"

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        TARGETED_DEVICE_FAMILY: "1"

        SWIFT_STRICT_CONCURRENCY: complete

        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChemistryCoach/Resources/Info.plist

    scheme:
      testTargets: []
      gatherCoverageData: true
